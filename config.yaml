# 动态选股系统配置文件
# 修改此文件可以调整选股参数

# 可用策略列表
strategies:
  - id: "high_freq"
    name: "低吸潜伏策略"
    description: "适合高频交易，寻找振幅大、成交活跃的创业板股票"
    enabled: true
  - id: "momentum_breakout"
    name: "动量突破策略"
    description: "寻找突破关键阻力位、放量上涨的股票"
    enabled: true
  - id: "noon_rush"
    name: "午间抢筹策略"
    description: "午间时段资金流入明显的股票"
    enabled: true
  - id: "tail_strength"
    name: "尾盘强势策略"
    description: "尾盘表现强势、资金流入的股票"
    enabled: true
  - id: "10x_stock"
    name: "10倍股潜力策略"
    description: "寻找具有长期成长潜力的优质股票"
    enabled: true
  - id: "sector_leaders"
    name: "板块龙头策略"
    description: "各行业板块的龙头股票"
    enabled: true

# 高频交易选股参数（低吸潜伏）
high_freq:
  # 价格范围（元）
  price_min: 5
  price_max: 100
  
  # 振幅要求（%）
  amplitude_min: 3.0
  
  # 成交额要求（元）
  turnover_min: 150000000  # 1.5亿
  
  # 涨跌幅范围（%）
  change_min: -5.0
  change_max: 1.0
  
  # 股票板块
  board: "创业板"  # 创业板股票（300/301）
  
  # 每轮选股数量
  selection_count: 10

# 动量突破策略参数
momentum_breakout:
  price_min: 5
  price_max: 100
  amplitude_min: 4.0
  turnover_min: 200000000  # 2亿
  change_min: 2.0  # 涨幅>2%
  change_max: 8.0
  board: "创业板"
  selection_count: 10

# 午间抢筹策略参数
noon_rush:
  price_min: 5
  price_max: 100
  amplitude_min: 2.5
  turnover_min: 150000000
  change_min: 0.5
  change_max: 5.0
  board: "创业板"
  time_range: "11:00-13:00"
  selection_count: 10

# 尾盘强势策略参数
tail_strength:
  price_min: 5
  price_max: 100
  amplitude_min: 3.0
  turnover_min: 150000000
  change_min: 1.0
  change_max: 6.0
  board: "创业板"
  time_range: "14:00-15:00"
  selection_count: 10

# 10倍股潜力筛选参数
10x_stock:
  # 市值上限（元）
  market_cap_max: 30000000000  # 300亿
  
  # 营收增长率要求（%）
  revenue_growth_min: 30
  
  # 净利润增长率要求（%）
  profit_growth_min: 30
  
  # PEG上限
  peg_max: 1.5
  
  # 重点行业
  industry_list:
    - "人工智能"
    - "半导体"
    - "新能源"
    - "创新药"
    - "机器人"
    - "储能"
    - "高端制造"
  
  # 最低成交额（元）
  turnover_min: 100000000  # 1亿

# 板块龙头策略参数
sector_leaders:
  price_min: 10
  price_max: 200
  amplitude_min: 2.0
  turnover_min: 500000000  # 5亿
  change_min: 0.5
  change_max: 10.0
  board: "全A股"
  selection_count: 15

# 系统设置
system:
  # 数据更新频率（秒）
  update_interval: 600  # 10分钟
  
  # 交易时间设置
  trading_hours:
    start: "09:30"
    end: "15:00"
  
  # 数据保存设置
  save_results: true
  save_format: "both"  # json, csv, both
  
  # 日志设置
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  
  # 排除股票列表文件
  exclude_file: "excluded_stocks.json"

# 风险控制参数
risk_control:
  # 单票止损比例（%）
  stop_loss: -8.0
  
  # 组合止损比例（%）
  portfolio_stop_loss: -15.0
  
  # 单票最大仓位比例（%）
  max_position_per_stock: 10.0
  
  # 单行业最大仓位比例（%）
  max_position_per_industry: 20.0
  
  # 最大持股数量
  max_holdings: 10

# 评分权重设置
scoring_weights:
  high_freq:
    amplitude: 0.4
    turnover: 0.3
    price_change: 0.2
    price_level: 0.1
  
  10x_stock:
    price_level: 0.3
    turnover: 0.4
    price_change: 0.3