<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态选股系统 - Web界面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .header p {
            color: #666;
            text-align: center;
            font-size: 1.1em;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .stat-card .label {
            color: #666;
            font-size: 0.9em;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        @media (max-width: 1200px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .stock-list {
            max-height: 500px;
            overflow-y: auto;
        }
        
        .stock-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s;
        }
        
        .stock-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }
        
        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .stock-name {
            font-weight: bold;
            color: #333;
            font-size: 1.1em;
        }
        
        .stock-code {
            color: #666;
            font-size: 0.9em;
        }
        
        .stock-price {
            font-weight: bold;
            color: #28a745;
        }
        
        .stock-change {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
        }
        
        .stock-change.positive {
            background: #d4edda;
            color: #155724;
        }
        
        .stock-change.negative {
            background: #f8d7da;
            color: #721c24;
        }
        
        .stock-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            font-size: 0.9em;
            color: #666;
        }
        
        .detail-item {
            text-align: center;
        }
        
        .detail-label {
            font-size: 0.8em;
            color: #999;
        }
        
        .detail-value {
            font-weight: bold;
            color: #333;
        }
        
        .strategy-tag {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-top: 5px;
        }
        
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
            display: block;
            margin: 20px auto;
        }
        
        .refresh-btn:hover {
            background: #5a67d8;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .file-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .file-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .file-item:hover {
            background: #e9ecef;
        }
        
        .file-item.active {
            background: #667eea;
            color: white;
        }
        
        .file-name {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .file-meta {
            font-size: 0.8em;
            color: #666;
        }
        
        .file-item.active .file-meta {
            color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>动态选股系统</h1>
            <p>高频交易与10倍股筛选 - 实时监控面板</p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>选股文件</h3>
                <div class="value" id="total-files">0</div>
                <div class="label">个结果文件</div>
            </div>
            <div class="stat-card">
                <h3>总选股次数</h3>
                <div class="value" id="total-selections">0</div>
                <div class="label">次推荐</div>
            </div>
            <div class="stat-card">
                <h3>最新更新</h3>
                <div class="value" id="latest-update">--</div>
                <div class="label">最后更新时间</div>
            </div>
            <div class="stat-card">
                <h3>策略分布</h3>
                <div class="value" id="strategy-count">0</div>
                <div class="label">种策略类型</div>
            </div>
        </div>
        
        <!-- 策略选择区域 -->
        <div class="card" style="margin-bottom: 30px;">
            <h2>🎯 策略选择与运行</h2>
            <div id="strategy-selector" style="margin: 20px 0;">
                <div class="loading">加载策略列表...</div>
            </div>
            <div id="strategy-result" style="margin-top: 20px; display: none;">
                <h3>运行结果</h3>
                <div id="strategy-result-content"></div>
            </div>
        </div>
        
        <div class="content-grid">
            <div class="card">
                <h2>📁 选股结果文件</h2>
                <div class="file-list" id="file-list">
                    <div class="loading">加载中...</div>
                </div>
                <button class="refresh-btn" onclick="loadFiles()">刷新文件列表</button>
            </div>
            
            <div class="card">
                <h2>📊 最新选股结果</h2>
                <div class="stock-list" id="stock-list">
                    <div class="loading">加载中...</div>
                </div>
                <button class="refresh-btn" onclick="loadLatest()">刷新最新结果</button>
            </div>
        </div>
    </div>
    
    <script>
        // 加载统计信息
        async function loadStatistics() {
            try {
                const response = await fetch('/api/statistics');
                const data = await response.json();
                
                if (data.success) {
                    const stats = data.statistics;
                    document.getElementById('total-files').textContent = stats.total_files;
                    document.getElementById('total-selections').textContent = stats.total_selections;
                    document.getElementById('latest-update').textContent = stats.latest_update || '--';
                    document.getElementById('strategy-count').textContent = Object.keys(stats.strategies).length;
                }
            } catch (error) {
                console.error('加载统计信息失败:', error);
            }
        }
        
        // 加载文件列表
        async function loadFiles() {
            try {
                const response = await fetch('/api/selections');
                const data = await response.json();
                
                const fileList = document.getElementById('file-list');
                
                if (data.success) {
                    if (data.files.length === 0) {
                        fileList.innerHTML = '<div class="loading">没有选股结果文件</div>';
                        return;
                    }
                    
                    fileList.innerHTML = data.files.map(file => `
                        <div class="file-item" onclick="loadFile('${file.filename}')">
                            <div class="file-name">${file.filename}</div>
                            <div class="file-meta">
                                大小: ${(file.size / 1024).toFixed(1)} KB | 
                                修改时间: ${file.modified}
                            </div>
                        </div>
                    `).join('');
                } else {
                    fileList.innerHTML = `<div class="error">加载失败: ${data.error}</div>`;
                }
            } catch (error) {
                console.error('加载文件列表失败:', error);
                document.getElementById('file-list').innerHTML = 
                    `<div class="error">加载失败: ${error.message}</div>`;
            }
        }
        
        // 加载特定文件
        async function loadFile(filename) {
            try {
                // 更新文件列表高亮
                document.querySelectorAll('.file-item').forEach(item => {
                    item.classList.remove('active');
                    if (item.querySelector('.file-name').textContent === filename) {
                        item.classList.add('active');
                    }
                });
                
                const response = await fetch(`/api/selection/${filename}`);
                const data = await response.json();
                
                if (data.success) {
                    displayStocks(data.data, filename);
                } else {
                    document.getElementById('stock-list').innerHTML = 
                        `<div class="error">加载失败: ${data.error}</div>`;
                }
            } catch (error) {
                console.error('加载文件失败:', error);
                document.getElementById('stock-list').innerHTML = 
                    `<div class="error">加载失败: ${error.message}</div>`;
            }
        }
        
        // 加载最新结果
        async function loadLatest() {
            try {
                const response = await fetch('/api/latest');
                const data = await response.json();
                
                if (data.success) {
                    displayStocks(data.data, data.filename);
                    
                    // 更新文件列表高亮
                    document.querySelectorAll('.file-item').forEach(item => {
                        item.classList.remove('active');
                        if (item.querySelector('.file-name').textContent === data.filename) {
                            item.classList.add('active');
                        }
                    });
                } else {
                    document.getElementById('stock-list').innerHTML = 
                        `<div class="error">加载失败: ${data.error}</div>`;
                }
            } catch (error) {
                console.error('加载最新结果失败:', error);
                document.getElementById('stock-list').innerHTML = 
                    `<div class="error">加载失败: ${error.message}</div>`;
            }
        }
        
        // 显示股票列表
        function displayStocks(stocks, filename) {
            const stockList = document.getElementById('stock-list');
            
            if (!stocks || stocks.length === 0) {
                stockList.innerHTML = '<div class="loading">没有选股数据</div>';
                return;
            }
            
            // 检查数据格式
            const firstStock = stocks[0];
            const isHighFreq = firstStock.hasOwnProperty('振幅');
            const is10x = firstStock.hasOwnProperty('潜力评分');
            
            let title = '';
            if (filename.includes('高频交易')) {
                title = '高频交易选股（低吸潜伏策略）';
            } else if (filename.includes('10倍股')) {
                title = '10倍股潜力筛选';
            } else {
                title = '选股结果';
            }
            
            stockList.innerHTML = `
                <h3 style="margin-bottom: 15px; color: #333;">${title}</h3>
                <p style="color: #666; margin-bottom: 20px; font-size: 0.9em;">
                    文件: ${filename} | 共 ${stocks.length} 只股票
                </p>
                ${stocks.map((stock, index) => `
                    <div class="stock-item">
                        <div class="stock-header">
                            <div>
                                <span class="stock-name">${stock['名称']}</span>
                                <span class="stock-code">${stock['代码']}</span>
                            </div>
                            <div>
                                <span class="stock-price">¥${stock['最新价']?.toFixed(2) || '--'}</span>
                                <span class="stock-change ${stock['涨跌幅'] >= 0 ? 'positive' : 'negative'}">
                                    ${stock['涨跌幅'] >= 0 ? '+' : ''}${stock['涨跌幅']?.toFixed(2) || '--'}%
                                </span>
                            </div>
                        </div>
                        <div class="stock-details">
                            ${isHighFreq ? `
                                <div class="detail-item">
                                    <div class="detail-label">振幅</div>
                                    <div class="detail-value">${stock['振幅']?.toFixed(2) || '--'}%</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">成交额</div>
                                    <div class="detail-value">${(stock['成交额'] / 100000000)?.toFixed(2) || '--'}亿</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">评分</div>
                                    <div class="detail-value">${stock['评分']?.toFixed(1) || '--'}</div>
                                </div>
                            ` : ''}
                            ${is10x ? `
                                <div class="detail-item">
                                    <div class="detail-label">成交额</div>
                                    <div class="detail-value">${(stock['成交额'] / 100000000)?.toFixed(2) || '--'}亿</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">潜力评分</div>
                                    <div class="detail-value">${stock['潜力评分']?.toFixed(1) || '--'}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">--</div>
                                    <div class="detail-value">--</div>
                                </div>
                            ` : ''}
                        </div>
                        <div style="margin-top: 10px;">
                            <span class="strategy-tag">${stock['策略'] || '未知'}</span>
                            ${stock['轮次'] ? `<span class="strategy-tag" style="background: #28a745;">第${stock['轮次']}轮</span>` : ''}
                        </div>
                    </div>
                `).join('')}
            `;
        }
        
        // 页面加载时执行
        document.addEventListener('DOMContentLoaded', function() {
            loadStatistics();
            loadFiles();
            loadLatest();
            loadStrategies();
            
            // 每30秒自动刷新
            setInterval(() => {
                loadStatistics();
                loadFiles();
            }, 30000);
        });
        
        // 加载策略列表
        async function loadStrategies() {
            try {
                const response = await fetch('/api/strategies');
                const data = await response.json();
                
                const strategySelector = document.getElementById('strategy-selector');
                
                if (data.success && data.strategies.length > 0) {
                    strategySelector.innerHTML = `
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px;">
                            ${data.strategies.map(strategy => `
                                <div style="background: #f8f9fa; border-radius: 10px; padding: 20px; border-left: 4px solid #667eea;">
                                    <h4 style="color: #333; margin-bottom: 10px;">${strategy.name}</h4>
                                    <p style="color: #666; font-size: 0.9em; margin-bottom: 15px;">${strategy.description}</p>
                                    <button onclick="runStrategy('${strategy.id}')" 
                                            style="background: #667eea; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9em;">
                                        运行策略
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    strategySelector.innerHTML = '<div class="error">没有可用的策略</div>';
                }
            } catch (error) {
                console.error('加载策略列表失败:', error);
                document.getElementById('strategy-selector').innerHTML = 
                    `<div class="error">加载策略列表失败: ${error.message}</div>`;
            }
        }
        
        // 运行策略
        async function runStrategy(strategyId) {
            const strategyResult = document.getElementById('strategy-result');
            const strategyResultContent = document.getElementById('strategy-result-content');
            
            strategyResult.style.display = 'block';
            strategyResultContent.innerHTML = '<div class="loading">正在运行策略，请稍候...</div>';
            
            try {
                const response = await fetch('/api/run_strategy', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ strategy_id: strategyId })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    strategyResultContent.innerHTML = `
                        <div style="background: #d4edda; color: #155724; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                            ✅ 策略运行成功！共选出 ${data.count} 只股票
                        </div>
                        <div style="max-height: 400px; overflow-y: auto;">
                            ${data.result.map((stock, index) => `
                                <div style="background: #f8f9fa; border-radius: 8px; padding: 15px; margin-bottom: 10px;">
                                    <div style="display: flex; justify-content: space-between; align-items: center;">
                                        <div>
                                            <span style="font-weight: bold; color: #333;">${stock['名称']}</span>
                                            <span style="color: #666; margin-left: 10px;">${stock['代码']}</span>
                                        </div>
                                        <div>
                                            <span style="font-weight: bold; color: ${stock['涨跌幅'] >= 0 ? '#28a745' : '#dc3545'};">
                                                ¥${stock['最新价']?.toFixed(2) || '--'}
                                            </span>
                                            <span style="margin-left: 10px; color: ${stock['涨跌幅'] >= 0 ? '#28a745' : '#dc3545'};">
                                                ${stock['涨跌幅'] >= 0 ? '+' : ''}${stock['涨跌幅']?.toFixed(2) || '--'}%
                                            </span>
                                        </div>
                                    </div>
                                    <div style="display: flex; gap: 20px; margin-top: 10px; font-size: 0.9em; color: #666;">
                                        <div>振幅: ${stock['振幅']?.toFixed(2) || '--'}%</div>
                                        <div>成交额: ${(stock['成交额'] / 100000000)?.toFixed(2) || '--'}亿</div>
                                        <div>评分: ${stock['评分']?.toFixed(1) || stock['潜力评分']?.toFixed(1) || '--'}</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    
                    // 刷新文件列表和统计信息
                    loadFiles();
                    loadStatistics();
                } else {
                    strategyResultContent.innerHTML = `
                        <div style="background: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px;">
                            ❌ 策略运行失败: ${data.error}
                        </div>
                    `;
                }
            } catch (error) {
                console.error('运行策略失败:', error);
                strategyResultContent.innerHTML = `
                    <div style="background: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px;">
                        ❌ 运行策略失败: ${error.message}
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
